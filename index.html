<!DOCTYPE html>
<html lang="en" data-theme="light" data-view="home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Kattsafe Sales Hiring Hub</title>
<link rel="icon" href="OS Icons/Light Blue Lushin.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   BRAND PALETTE
   plum #321432 · atomic yellow #DCFF3C · earth #F7F7F2
   blue #008CFF · red #E6284B · orange #FF8700 · purple #A54CFF
   ========================================================================== */
:root{
  --bg:#F7F7F2;
  --surface:#FFFFFF;
  --plate:#FFFFFF;
  --line:#E7E5DF;
  --line-soft:#F0EFE9;
  --ink:#321432;
  --ink-2:#6B5A6B;
  --ink-3:#9E909E;
  --hover:#EFEEE8;
  --zebra:#F7F8FA;
  --accentring:rgba(0,140,255,.45);
  --link:#0064C8;
  --shadow:0 1px 2px rgba(50,20,50,.05), 0 10px 28px -18px rgba(50,20,50,.4);
}
html[data-theme="dark"]{
  --bg:#1A0A1A;
  --surface:#261026;
  --plate:#FFFFFF;
  --line:#3C213C;
  --line-soft:#2E162E;
  --ink:#F7F7F2;
  --ink-2:#C4B0C4;
  --ink-3:#8F7C8F;
  --hover:#301630;
  --zebra:#20122A;
  --accentring:rgba(0,140,255,.55);
  --link:#5AB8FF;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -18px rgba(0,0,0,.75);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  min-height:100vh;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);
  font-family:Poppins,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}

.wrap{
  width:100%;max-width:min(1900px,94vw);margin:0 auto;padding:26px 40px 40px;
  flex:1;display:flex;flex-direction:column;min-height:0;
}
#view{flex:1;display:flex;flex-direction:column;min-height:0;}
html[data-view="home"] #view{justify-content:center;padding-bottom:3vh;}
/* section pages read like documents — hold them to a comfortable measure */
html[data-view="section"] .wrap{max-width:min(1120px,94vw);}

/* ==========================================================================
   HEADER
   ========================================================================== */
.pagehead{display:flex;align-items:center;gap:18px;margin:0 0 26px;flex:0 0 auto;}
.marks{display:flex;align-items:center;gap:17px;}
.hx{display:block;height:23px;width:auto;color:var(--ink);}
.marks .div{width:1px;height:26px;background:var(--line);}
.lu img{height:27px;width:auto;display:block;}
.lu .dk{display:none;}
html[data-theme="dark"] .lu .lt{display:none;}
html[data-theme="dark"] .lu .dk{display:block;}

.iconbtn{
  margin-left:auto;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  width:38px;height:38px;flex:0 0 38px;border-radius:10px;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .12s ease,color .12s ease;
}
.iconbtn:hover{background:var(--hover);color:var(--ink);}

/* ---- language toggle (Continental Europe) ---- */
.langpick{
  margin-left:auto;display:inline-flex;gap:3px;padding:4px;
  border:1px solid var(--line);background:var(--surface);border-radius:13px;
  box-shadow:var(--shadow);
}
.langpick[hidden]{display:none!important;}
.langpick + .iconbtn{margin-left:12px;}
.langpick button{
  border:0;background:transparent;color:var(--ink-2);cursor:pointer;
  font:inherit;font-size:15px;font-weight:600;letter-spacing:-.005em;
  padding:9px 18px;border-radius:10px;line-height:1.1;white-space:nowrap;
  transition:background .12s ease,color .12s ease;
}
.langpick button:hover{color:var(--ink);background:var(--hover);}
.langpick button.on{color:#fff;}
.langpick button.on:hover{color:#fff;}
@media (max-width:820px){
  .pagehead{flex-wrap:wrap;}
  .langpick{margin-left:0;order:3;width:100%;}
  .langpick button{flex:1;padding:9px 6px;font-size:14px;}
}
.iconbtn svg{width:18px;height:18px;display:block;}

.page-title{
  font-size:21px;font-weight:500;letter-spacing:-.01em;
  color:var(--ink-2);margin:0 0 20px;flex:0 0 auto;
}

/* ==========================================================================
   HOME — region chooser
   ========================================================================== */
.regions{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;}
.region{
  aspect-ratio:5/7;max-height:68vh;border-radius:24px;
  display:flex;align-items:flex-end;padding:30px 26px;
  transition:transform .16s ease;
}
.region:hover{transform:translateY(-5px);}
.region .rn{font-size:32px;font-weight:600;letter-spacing:-.022em;line-height:1.12;}

/* ==========================================================================
   BANNER — region + section headers
   ========================================================================== */
.banner{border-radius:24px;padding:42px 36px;margin:0 0 26px;flex:0 0 auto;}
.banner .eyebrow{font-size:15px;font-weight:200;opacity:.82;margin:0 0 6px;}
.banner h1{font-size:46px;font-weight:600;letter-spacing:-.026em;line-height:1.08;margin:0;}
.banner.sec{padding:30px 32px;}
.banner.sec h1{font-size:34px;}

.backlink{
  display:inline-flex;align-items:center;gap:8px;
  font-size:14.5px;font-weight:400;color:var(--ink-3);
  margin:0 0 18px;transition:color .12s ease;
}
.backlink:hover{color:var(--ink);}
.backlink svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* ==========================================================================
   REGION PAGE — assessment buttons + nav tiles
   ========================================================================== */
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:0 0 30px;}
.role{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  border-radius:16px;padding:22px 26px;
  color:#fff;font-size:19px;font-weight:600;letter-spacing:-.012em;
  transition:transform .14s ease,filter .14s ease;
}
.role:hover{transform:translateY(-3px);filter:brightness(1.06);}
.role svg{width:19px;height:19px;flex:0 0 19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.8;}

.navgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.navtile{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  display:flex;align-items:center;justify-content:center;
  min-height:168px;
  box-shadow:var(--shadow);
  transition:transform .14s ease,box-shadow .14s ease;
}
.navtile:hover{transform:translateY(-4px);}
/* an odd tile left alone on the last row stretches rather than sitting orphaned */
.navgrid .navtile:nth-child(3n+1):last-child{grid-column:1/-1;min-height:118px;}
.navgrid .navtile:nth-child(3n+1):last-child img{max-width:230px;}
.navtile img{width:100%;max-width:300px;height:auto;display:block;}
/* the artwork is transparent with dark ink — flip its lightness in dark mode
   so it reads on the dark tile while keeping the icon hues */
html[data-theme="dark"] .navtile img{filter:invert(1) hue-rotate(180deg) brightness(1.08);}
.navtile.wide{min-height:96px;padding:12px;margin:0 0 20px;}
.navtile.wide img{max-width:196px;}

/* ==========================================================================
   SECTION PAGE — document styling
   ========================================================================== */
.panel{
  background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:30px 34px;margin-bottom:18px;
  box-shadow:var(--shadow);
}
.panel h2{
  font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.25;
  margin:0 0 18px;color:var(--ink);
}
.panel h3{
  font-size:17px;font-weight:600;letter-spacing:-.01em;
  margin:24px 0 10px;color:var(--ink);
}
.panel h3:first-child{margin-top:0;}
.panel p{font-size:16.5px;line-height:1.68;color:var(--ink-2);margin:0 0 14px;}
.panel p:last-child{margin-bottom:0;}
.panel ul{margin:0 0 14px;padding-left:22px;}
.panel li{font-size:16.5px;line-height:1.68;color:var(--ink-2);margin-bottom:8px;padding-left:4px;}
.panel li::marker{color:var(--ink-3);}
.panel strong{font-weight:600;color:var(--ink);}
.panel a.inline{border-bottom:1.5px solid currentColor;padding-bottom:1px;font-weight:500;}

.lead{font-size:18px;line-height:1.6;color:var(--ink-2);margin:0 0 22px;}
.doc [contenteditable]{outline:none;}
.doc [contenteditable]:focus-visible{outline:none;}
.edithint{font-size:14px;color:var(--ink-3);margin:14px 0 0;}

/* ==========================================================================
   TRAINING SESSIONS
   ========================================================================== */
.vidgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.vidcard{
  display:block;border-radius:16px;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow);
  transition:transform .16s ease,box-shadow .16s ease;
}
.vidcard:hover{transform:translateY(-4px);}
.vidcard .thumb{position:relative;display:block;}
.vidcard img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;}
.vidcard .play{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .16s ease;background:rgba(4,18,44,.30);
}
.vidcard:hover .play{opacity:1;}
.vidcard .play span{
  width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.94);
  display:flex;align-items:center;justify-content:center;
}
.vidcard .play svg{width:22px;height:22px;fill:#04122c;margin-left:3px;}


.stage{
  width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;
  box-shadow:0 20px 52px -26px rgba(4,18,44,.7);margin:0 0 26px;
}
.stage iframe{display:block;width:100%;height:100%;border:0;}

.shead{
  font-size:12.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);margin:30px 0 14px;
}
/* one column — a two-column list of chapters is hard to scan */
.chips{display:grid;grid-template-columns:1fr;gap:8px;}
/* three sessions share this page now, so each one gets a real heading and a
   player capped to a comfortable reading width rather than the full column */
.tsession{margin-bottom:40px;padding-bottom:40px;border-bottom:1px solid var(--line);}
.tsession:last-child{margin-bottom:0;padding-bottom:0;border-bottom:0;}
.tsession .shead{
  font-size:21px;font-weight:700;letter-spacing:-.015em;text-transform:none;
  color:var(--ink);margin:0 0 16px;
}
.tsession .stage{max-width:840px;margin-bottom:20px;}
.tsession .chips{max-width:840px;}
.chip{
  display:flex;align-items:baseline;gap:12px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:11px 14px;cursor:pointer;font:inherit;color:var(--ink-2);
  transition:border-color .12s ease,color .12s ease,background .12s ease;
}
.chip:hover{border-color:var(--ink-3);color:var(--ink);background:var(--hover);}
.chip .ct{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex:0 0 auto;}
.chip .cl{font-size:15px;font-weight:500;line-height:1.35;}
.chip .cl strong{font-weight:700;color:var(--ink);}

/* ---- the slim video bar that sits with the region grid ---- */
.watchbar{
  display:flex;align-items:center;gap:16px;width:100%;
  border-radius:16px;padding:20px 24px;margin:20px 0 0;
  text-decoration:none;transition:transform .13s ease,filter .13s ease;
}
.watchbar:hover{transform:translateY(-3px);filter:brightness(1.05);}
.watchbar .wp{
  flex:0 0 auto;width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.22);display:grid;place-items:center;
}
.watchbar .wp svg{width:17px;height:17px;fill:currentColor;margin-left:2px;}
/* an outline glyph brings its own stroke and must not be filled */
.watchbar .wp svg[stroke]{fill:none;margin-left:0;width:18px;height:18px;}
.watchbar .wt{font-size:19px;font-weight:600;letter-spacing:-.015em;}
.watchbar .wa{margin-left:auto;flex:0 0 auto;opacity:.85;}
.watchbar .wa svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;}

/* timestamps stay visible when the player cannot be seeked from the page */
/* ---- findings reference ---- */
.ffilter{
  width:100%;font:inherit;font-size:16px;color:var(--ink);
  background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  padding:13px 16px;margin:0 0 6px;transition:border-color .12s ease;
}
.ffilter:focus{outline:none;border-color:var(--ink-3);}
.fnone{font-size:15.5px;color:var(--ink-3);margin:16px 0 0;}
.frow .fn a{
  color:var(--link);border-bottom:1.5px solid currentColor;padding-bottom:1px;
  transition:filter .12s ease;
}
.frow .fn a:hover{filter:brightness(1.25);}

/* ---- one competency article ---- */
.cjump{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px;}
.cjump a{
  font-size:14.5px;font-weight:500;color:var(--ink-2);
  border:1px solid var(--line);border-radius:999px;padding:6px 13px;
  transition:border-color .12s ease,color .12s ease,background .12s ease;
}
.cjump a:hover{border-color:var(--ink-3);color:var(--ink);background:var(--hover);}
.cmeta{font-size:14.5px;color:var(--ink-3);margin:18px 0 0;line-height:1.55;}
.cmeta b{font-weight:600;color:var(--ink-2);}
.cfind{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:24px 26px;margin:0 0 14px;box-shadow:var(--shadow);scroll-margin-top:18px;
}
.cfind h3{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0 0 10px;color:var(--ink);}
.cfind p{font-size:16.5px;line-height:1.62;color:var(--ink-2);margin:0 0 11px;}
.cfind p:last-child{margin-bottom:0;}
.cbox{
  margin:16px 0 0;padding:14px 18px;border-radius:12px;
  border-left:3px solid var(--line);background:var(--hover);
}
.cbox .cbh{
  font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 7px;
}
.cbox .cbh + ul{margin:0 0 14px;}
.cbox ul{list-style:none;margin:0;padding:0;}
.cbox li{
  position:relative;padding-left:15px;margin:0 0 4px;
  font-size:14.5px;line-height:1.5;color:var(--ink-2);
}
.cbox li::before{
  content:"";position:absolute;left:2px;top:.62em;width:4px;height:4px;
  border-radius:50%;background:var(--ink-3);opacity:.6;
}
.csec{margin:0 0 14px;}
.csec h3{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0 0 10px;color:var(--ink);}
@media (max-width:820px){
  .cfind{padding:20px 18px;border-radius:14px;}
}
.fgroup{margin:26px 0 0;}
.fgroup:first-of-type{margin-top:22px;}
.fglabel{
  font-size:12.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 10px;
}
.frow{
  display:grid;grid-template-columns:250px 1fr;gap:10px 24px;
  padding:14px 0;border-top:1px solid var(--line);
}
.frow .fn{font-size:16.5px;font-weight:600;color:var(--ink);line-height:1.4;}
.frow .fd{font-size:16.5px;line-height:1.6;color:var(--ink-2);}
@media (max-width:820px){
  .frow{grid-template-columns:1fr;gap:4px;padding:13px 0;}
}

.tchip.static,.tmini.static,.chip.static{cursor:default;}
.tchip.static:hover,.tmini.static:hover{filter:none;}
@media (max-width:640px){
  .watchbar{padding:17px 18px;gap:13px;}
  .watchbar .wt{font-size:17px;}
}

.osec{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:26px 28px;margin:0 0 18px;box-shadow:var(--shadow);
}
.osec-h{display:flex;align-items:flex-start;gap:14px;margin:0 0 16px;}
.osec-h h3{font-size:21px;font-weight:600;letter-spacing:-.018em;line-height:1.3;margin:0;color:var(--ink);}
.tchip{
  flex:0 0 auto;border:0;border-radius:9px;padding:6px 11px;cursor:pointer;
  font:inherit;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
  color:#fff;transition:filter .12s ease;
}
.tchip:hover{filter:brightness(1.12);}
.pts{list-style:none;margin:0;padding:0;}
.pts > li{display:flex;gap:13px;align-items:flex-start;margin:0 0 13px;}
.pts > li:last-child{margin-bottom:0;}
.pts p{margin:0;font-size:16.5px;line-height:1.62;color:var(--ink-2);}
.tmini{
  flex:0 0 auto;margin-top:2px;
  border:1.5px solid;border-radius:999px;padding:2px 9px;cursor:pointer;
  font:inherit;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  background:transparent;transition:filter .12s ease;
}
.tmini:hover{filter:brightness(.85);}
.subs{list-style:none;margin:8px 0 0;padding:0;}
.subs li{
  position:relative;padding-left:16px;margin:0 0 5px;
  font-size:15px;line-height:1.55;color:var(--ink-3);
}
.subs li::before{
  content:"";position:absolute;left:2px;top:.68em;width:4px;height:4px;
  border-radius:50%;background:var(--ink-3);opacity:.6;
}
.oquote{
  margin:18px 0 0;padding:14px 18px;border-radius:12px;border-left:4px solid;
  font-size:16.5px;line-height:1.55;font-style:italic;color:var(--ink);
}
.oquote .tmini{font-style:normal;margin-left:8px;vertical-align:2px;}
.figs{display:grid;gap:14px;margin:18px 0 0;grid-template-columns:1fr;}
.figs.two{grid-template-columns:1fr 1fr;}
.figs img{
  display:block;width:100%;height:auto;border-radius:10px;
  border:1px solid var(--line);background:#fff;
}
@media (max-width:820px){
  .vidgrid{grid-template-columns:1fr;gap:14px;}
  .chips{grid-template-columns:1fr;}
  .osec{padding:22px 20px;border-radius:16px;}
  .osec-h h3{font-size:19px;}
  .figs.two{grid-template-columns:1fr;}
}

/* ---- Applicant tracking sheet ---- */
.trkbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 18px;}
.trkbar .sp{margin-left:auto;}
.tbtn{
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:10px;padding:10px 16px;font-size:14.5px;font-weight:600;
  cursor:pointer;transition:border-color .12s ease,color .12s ease,background .12s ease;
}
.tbtn:hover{color:var(--ink);border-color:var(--ink-3);background:var(--hover);}
.tbtn.go{color:#fff;border-color:transparent;}
.trkwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);}
table.trk{border-collapse:separate;border-spacing:0;width:100%;min-width:1060px;font-size:14.5px;}
table.trk th{
  position:sticky;top:0;z-index:2;
  background:#5B95F9;color:#fff;
  font-weight:600;text-align:left;white-space:nowrap;
  padding:12px 11px;font-size:13.5px;letter-spacing:.01em;
  text-transform:none;                       /* keep the sheet's own casing */
}
table.trk th:first-child{border-top-left-radius:13px;}
table.trk th:last-child{border-top-right-radius:13px;}
table.trk td{padding:0;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
table.trk tbody tr:nth-child(even){background:var(--zebra);}
table.trk tbody tr:hover{background:var(--hover);}
table.trk input{
  width:100%;border:0;background:transparent;color:var(--ink);
  font-family:inherit;font-size:14.5px;padding:12px;outline:none;
}
table.trk input:focus{box-shadow:inset 0 0 0 2px var(--accentring);border-radius:8px;}
table.trk td.mark{text-align:center;cursor:pointer;user-select:none;width:74px;}
table.trk td.mark span{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;margin:9px auto;border-radius:8px;
  border:1.5px solid var(--line);color:transparent;font-size:15px;font-weight:700;
  transition:background .12s ease,color .12s ease,border-color .12s ease;
}
table.trk td.mark.on span{color:#fff;border-color:transparent;}
table.trk td.yn{text-align:center;cursor:pointer;user-select:none;width:104px;font-weight:600;}
table.trk td.yn span{display:inline-block;padding:5px 14px;border-radius:999px;font-size:13px;}
.trknote{font-size:14px;color:var(--ink-3);margin:14px 0 0;}

/* ---- Process Checklist outline ---- */
.outline{margin:0;padding-left:26px;}
.outline > li{
  font-size:17.5px;line-height:1.55;color:var(--ink);
  margin:0 0 22px;padding-left:6px;
}
.outline > li:last-child{margin-bottom:0;}
.outline > li::marker{color:var(--ink-3);font-weight:600;}
.outline .o1{font-weight:600;color:var(--ink);}
.outline .o-note{font-weight:400;color:var(--ink-3);font-size:15.5px;}
.outline ul{list-style:none;margin:10px 0 0;padding-left:0;}
.outline ul li{
  position:relative;
  font-size:16.5px;line-height:1.6;font-weight:400;color:var(--ink-2);
  margin:0 0 7px;padding-left:18px;
}
.outline ul li::before{
  content:"";position:absolute;left:2px;top:.72em;
  width:5px;height:5px;border-radius:50%;background:var(--ink-3);opacity:.55;
}
.outline ul ul{margin-top:6px;}
.outline ul ul li{font-size:15.5px;color:var(--ink-3);}
a.lnk{
  display:inline-block;
  font-size:13px;font-weight:600;letter-spacing:.01em;
  padding:1px 9px 2px;margin-left:4px;
  border:1.5px solid;border-radius:999px;
  vertical-align:1px;
}
a.lnk:hover{filter:brightness(.88);}

/* numbered steps */
.step{display:flex;gap:20px;padding:22px 0;}
.step + .step{border-top:1px solid var(--line-soft);}
.step:first-child{padding-top:0;}
.step:last-child{padding-bottom:0;}
.step .num{
  width:36px;height:36px;flex:0 0 36px;border-radius:11px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;color:#fff;
}
.step .sb{min-width:0;flex:1;}
.step .sb h3{margin-top:0;}

/* checklist */
.check{display:flex;gap:14px;align-items:flex-start;padding:11px 0;cursor:pointer;}
.check + .check{border-top:1px solid var(--line-soft);}
.check input{
  appearance:none;-webkit-appearance:none;
  width:21px;height:21px;flex:0 0 21px;margin:3px 0 0;
  border:1.7px solid var(--ink-3);border-radius:6px;background:var(--surface);
  cursor:pointer;transition:background .13s ease,border-color .13s ease;
}
.check input:checked{border-color:transparent;}
.check input:checked::after{
  content:"";display:block;width:5px;height:10px;margin:2px 0 0 6px;
  border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(43deg);
}
.check span{font-size:16.5px;line-height:1.6;color:var(--ink-2);}
.check input:checked ~ span{color:var(--ink-3);text-decoration:line-through;}
.check input:checked ~ span strong{color:var(--ink-3);font-weight:500;}
.check .sub{display:block;font-size:14.5px;color:var(--ink-3);margin-top:3px;}

/* collapsible */
.fold{border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;}
.fold > summary{
  list-style:none;cursor:pointer;padding:16px 20px;
  font-size:16px;font-weight:500;color:var(--ink);
  display:flex;align-items:center;gap:11px;
}
.fold > summary::-webkit-details-marker{display:none;}
.fold > summary::after{
  content:"";margin-left:auto;width:9px;height:9px;
  border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);
  transform:rotate(45deg);transition:transform .18s ease;
}
.fold[open] > summary::after{transform:rotate(-135deg);}
.fold .foldbody{padding:2px 20px 20px;}
.fold .foldbody > :last-child{margin-bottom:0;}

/* copyable block */
.copyblock{margin-bottom:16px;}
.copyblock .cbhead{
  display:flex;align-items:center;gap:12px;margin-bottom:8px;
}
.copyblock .cblabel{font-size:14px;font-weight:500;color:var(--ink-3);}
.copybtn{
  margin-left:auto;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);border-radius:9px;padding:7px 14px;
  font-size:13.5px;font-weight:500;cursor:pointer;
  transition:background .12s ease,color .12s ease,border-color .12s ease;
}
.copybtn:hover{background:var(--hover);color:var(--ink);}
.copybtn.done{color:#fff;border-color:transparent;}
.pre{
  background:var(--bg);border:1px solid var(--line);border-radius:12px;
  padding:18px 20px;font-size:15.5px;line-height:1.62;color:var(--ink-2);
  white-space:pre-wrap;word-break:break-word;
}

/* callout */
.note{
  border-radius:14px;padding:20px 22px;margin-bottom:16px;
  font-size:16px;line-height:1.62;
}
.note strong{font-weight:600;}

/* table */
.tblwrap{overflow-x:auto;margin-bottom:16px;}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:15.5px;}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line-soft);color:var(--ink-2);}
th{font-weight:600;color:var(--ink);font-size:13.5px;letter-spacing:.03em;text-transform:uppercase;}

/* big outbound card */
.bigcard{
  display:flex;align-items:center;gap:22px;
  border-radius:20px;padding:34px;color:#fff;
  transition:transform .14s ease;
}
.bigcard:hover{transform:translateY(-3px);}
.bigcard .bt{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2;}
.bigcard .bs{display:block;font-size:15px;opacity:.85;margin-top:4px;}
.bigcard svg{width:26px;height:26px;flex:0 0 26px;margin-left:auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* ==========================================================================
   EMAIL TEMPLATE BUILDER
   ========================================================================== */
.langrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:26px;}
.langrow[hidden]{display:none;}
.langbtn{
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:13px;padding:15px 12px;font-size:16px;font-weight:500;
  cursor:pointer;transition:all .13s ease;
}
.langbtn:hover{background:var(--hover);color:var(--ink);}
.langbtn.on{color:#fff;border-color:transparent;font-weight:600;}

/* the role row keeps its bottom margin only when no language row follows */
.langrow.hasSub{margin-bottom:12px;}
/* language sub-toggle — quieter than the role buttons above it */
.emlangs{
  display:flex;flex-wrap:wrap;gap:7px;margin:0 0 26px;
}
.emlangs button{
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:11px;padding:9px 15px;font:inherit;font-size:14.5px;font-weight:500;
  cursor:pointer;white-space:nowrap;transition:all .13s ease;
}
.emlangs button:hover{background:var(--hover);color:var(--ink);}
.emlangs button.on{color:#fff;border-color:transparent;font-weight:600;}

label{display:block;font-size:13.5px;font-weight:500;color:var(--ink);margin:0 0 8px;}
.field{margin-bottom:22px;}
input[type=text]{
  width:100%;font-family:inherit;font-size:16px;color:var(--ink);
  padding:15px 17px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--surface);transition:border-color .15s,box-shadow .15s;
}
input[type=text]:focus{outline:none;}
input[type=text]::placeholder{color:var(--ink-3);}

.btn{
  display:block;width:100%;font-family:inherit;font-size:17px;font-weight:500;
  padding:19px 24px;border:none;border-radius:999px;cursor:pointer;
  transition:transform .12s,filter .18s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{color:#fff;margin-top:8px;}
.btn-primary:hover{filter:brightness(1.07);}
.btn-outline{color:var(--ink);background:var(--surface);border:1.5px solid var(--line);}
.btn-outline:hover{background:var(--hover);}

.doc{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:28px 30px;}
.doc .body{font-size:15.5px;line-height:1.68;color:var(--ink-2);}
.doc .body p{margin:0 0 15px;}
.doc .body p.tight{margin:0 0 4px;}
.doc .body b{font-weight:600;color:var(--ink);}
.doc .body ul{margin:6px 0 15px;padding-left:22px;}
.doc .body li{margin-bottom:5px;}
.doc .body a{color:#008CFF;word-break:break-all;}
.missing,.token{
  background:rgba(230,40,75,.13);color:#E6284B;
  border-radius:4px;padding:1px 5px;font-weight:500;
}
.actions{display:flex;flex-direction:column;gap:12px;margin-top:26px;}

/* ---- Re-written ads ---- */
.adpick{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.adpick .p{
  display:flex;flex-direction:column;justify-content:flex-end;
  min-height:250px;border-radius:18px;padding:26px 24px;
  transition:transform .16s ease,box-shadow .16s ease;
}
.adpick .p:hover{transform:translateY(-4px);}
.adpick .p .sc{font-size:13.5px;font-weight:500;opacity:.85;margin:0 0 7px;}
.adpick .p .nm{font-size:26px;font-weight:600;letter-spacing:-.022em;line-height:1.15;}
.adhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 18px;}
.adhead h2{font-size:19px;font-weight:600;letter-spacing:-.018em;margin:0;color:var(--ink);}
.adnote{font-size:15.5px;line-height:1.62;color:var(--ink-2);margin:0 0 18px;}
.adtbl{width:100%;border-collapse:collapse;font-size:14.5px;margin:2px 0 0;}
.adtbl th{
  text-align:left;text-transform:none;font-size:12px;font-weight:700;letter-spacing:.06em;
  color:var(--ink-3);padding:0 14px 9px 0;border-bottom:1px solid var(--line);white-space:nowrap;
}
.adtbl td{padding:11px 14px 11px 0;border-bottom:1px solid var(--line-soft);
  vertical-align:top;color:var(--ink-2);line-height:1.5;}
.adtbl td:first-child{color:var(--ink);font-weight:600;}
.adtbl td.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;}
.adtbl tr:last-child td{border-bottom:0;}
.fixlist{list-style:none;margin:0;padding:0;counter-reset:fx;}
.fixlist li{position:relative;padding-left:38px;margin:0 0 16px;counter-increment:fx;}
.fixlist li:last-child{margin-bottom:0;}
.fixlist li::before{
  content:counter(fx);position:absolute;left:0;top:1px;
  width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;
}
.fixlist .fh{display:block;font-size:16px;font-weight:600;color:var(--ink);line-height:1.4;}
.fixlist .fb{display:block;font-size:15.5px;color:var(--ink-2);line-height:1.6;margin-top:3px;}

/* ---- STAR chapters, rendered in-platform ---- */
.chgroup{margin:0 0 26px;}
.chgroup:last-child{margin-bottom:0;}
.chlabel{
  font-size:17.5px;font-weight:600;letter-spacing:-.014em;line-height:1.35;
  color:var(--ink);margin:0 0 12px;
}
.chpoints{list-style:none;margin:0;padding:0;}
.chpoints li{
  position:relative;padding-left:19px;margin:0 0 11px;
  font-size:16.5px;line-height:1.62;color:var(--ink-2);
}
.chpoints li:last-child{margin-bottom:0;}
.chpoints li::before{
  content:"";position:absolute;left:2px;top:.72em;width:5px;height:5px;
  border-radius:50%;background:var(--ink-3);opacity:.55;
}
.chpoints strong,.chpoints em{color:var(--ink);}
.chvid{
  width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;
  box-shadow:0 20px 52px -26px rgba(4,18,44,.7);margin:0 0 26px;display:block;
}
.chvid video{display:block;width:100%;height:100%;}
.chfields{display:grid;gap:16px;}
.chfields label{display:block;}
.chfields .fl{
  display:block;font-size:15px;font-weight:600;color:var(--ink);margin:0 0 5px;line-height:1.4;
}
.chfields .fh{display:block;font-size:13.5px;color:var(--ink-3);margin:0 0 7px;line-height:1.5;}
.chfields input,.chfields textarea{
  width:100%;font:inherit;font-size:15.5px;color:var(--ink);
  background:var(--bg);border:1.5px solid var(--line);border-radius:11px;
  padding:11px 14px;transition:border-color .12s ease;
}
.chfields input:focus,.chfields textarea:focus{outline:none;border-color:var(--ink-3);}
.chfields textarea{min-height:88px;resize:vertical;line-height:1.55;}
.chchecks{display:grid;grid-template-columns:1fr 1fr;gap:9px 22px;}
.chchecks label{
  display:flex;gap:11px;align-items:flex-start;cursor:pointer;
  font-size:15.5px;line-height:1.5;color:var(--ink-2);
}
.chchecks input{margin:3px 0 0;width:17px;height:17px;flex:0 0 17px;accent-color:currentColor;}
.chchecks input:checked + span{color:var(--ink-3);text-decoration:line-through;}
.chfiles{display:grid;gap:10px;}
.chfile{
  display:flex;gap:14px;align-items:baseline;
  border:1px solid var(--line);border-radius:12px;padding:13px 16px;
  background:var(--surface);transition:border-color .12s ease,background .12s ease;
}
.chfile:hover{border-color:var(--ink-3);background:var(--hover);}
.chfile .fn{font-size:15.5px;font-weight:600;color:var(--ink);flex:0 0 auto;}
.chfile .fd{font-size:14px;color:var(--ink-3);line-height:1.45;}
@media (max-width:820px){
  .chchecks{grid-template-columns:1fr;}
  .chfile{flex-direction:column;gap:3px;}
}
@media (max-width:820px){
  .adpick{grid-template-columns:1fr;gap:14px;}
  .adpick .p{min-height:150px;}
  .adtbl{font-size:14px;}
  .adtbl th:nth-child(3),.adtbl td:nth-child(3){display:none;}
}
.hidden{display:none;}

/* ==========================================================================
   RESPONSIVE
   ========================================================================== */
@media (max-height:820px){ .region .rn{font-size:28px;} }
@media (max-width:1180px){
  .regions{grid-template-columns:repeat(3,1fr);}
  .region{aspect-ratio:4/3;max-height:none;}
  .navgrid{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:820px){
  body{font-size:16.5px;}
  .wrap{padding:20px 18px 40px;}
  .regions{grid-template-columns:1fr;gap:13px;}
  .region{aspect-ratio:auto;min-height:120px;padding:22px 22px;border-radius:18px;}
  .region .rn{font-size:26px;}
  .banner{padding:30px 24px;border-radius:18px;}
  .banner h1{font-size:33px;}
  .banner.sec h1{font-size:27px;}
  .roles{grid-template-columns:1fr;gap:11px;}
  .role{padding:19px 22px;font-size:17.5px;}
  .navgrid{grid-template-columns:1fr;gap:14px;}
  .navtile{min-height:132px;border-radius:16px;}
  .navtile.wide{min-height:104px;padding:12px;margin-bottom:14px;}
  .navtile.wide img{max-width:200px;}
  .panel{padding:24px 22px;border-radius:16px;}
  .panel h2{font-size:21px;}
  .bigcard{padding:26px;gap:16px;}
  .bigcard .bt{font-size:22px;}
  .langrow{grid-template-columns:1fr;gap:10px;}
  .emlangs button{flex:1 0 30%;padding:9px 6px;}

  .hx{height:20px;}
  .lu img{height:24px;}
}
@media print{
  .pagehead,.backlink,.copybtn,.actions{display:none!important;}
  .panel{box-shadow:none;break-inside:avoid;}
}

<body>

<div class="wrap">
  <div class="pagehead">
    <a class="marks" href="#" title="Home">
      <span class="lu">
        <img class="lt" src="Lushin Logo Icons/Lushin Logo Blue.svg" alt="Lushin">
        <img class="dk" src="Lushin Logo Icons/Lushin Logo Icon - Arctic White.svg" alt="Lushin">
      </span>
    </a>
    <div class="langpick" id="langpick" hidden></div>
    <button class="iconbtn" id="theme" title="Toggle light / dark" aria-label="Toggle light or dark theme"></button>
  </div>
  <div id="view"></div>
</div>

<script>
/* ==========================================================================
   TO EDIT CONTENT

   Swap a region's assessment links : edit that region's "roles" array below —
                                      label + url per button. Nothing else moves.
   Swap the email assessment links  : edit that region's "evals" object.
   Add a region                     : copy a whole REGIONS block.
   Change a section's writing       : edit its entry in SECTIONS. Every region
                                      shares SECTIONS, so one edit updates all five.

   Colours are the shared portal palette:
     plum #321432 · atomic yellow #DCFF3C · earth #F7F7F2
     blue #008CFF · red #E6284B · orange #FF8700 · purple #A54CFF
   ========================================================================== */

var STAR_URL      = "https://lushin-inc.github.io/star/";
var INTERVIEW_URL = "https://lushin-inc.github.io/interview-guide/";
var TRACKER_URL   = "https://docs.google.com/spreadsheets/d/123oS0ye0pynqgMY-IaLpH_bpdx7j58vAEEdis4_S4Z4/edit?usp=sharing";

/* PLACEHOLDER — regions whose links have not come in yet still point at the
   Lushin demo license. Replace that region's "options" array as they arrive. */
var PLACEHOLDER = "https://info.objectivemanagement.com/License.aspx?ID=2885&MI=1&bc1=Search+Licenses&bc1u=Licenses.aspx%3fstatus%3d2%26d1%3d%26d2%3d%26d%3d61%26c%3d357%26pt%3d1%26csr%3d&bc2=Assessments";

/* Each option is one button across the top of the region page AND one choice
   on the Email Templates page.
     label — the button text
     job   — the role title written into the email
     copy  — which language the email is written in (en / de / es)
     reg   — OMG registration page (the top button)
     eval  — candidate assessment link (fills the email)                       */
var PLACEHOLDER_OPTIONS = [
  {key:"bdm", label:"BDM", job:"Business Development Manager", copy:"en", reg:PLACEHOLDER, eval:""}
];

/* Home keeps five colours so each region is recognisable at a glance.
   Every page BELOW home runs on one blue theme with a gold accent —
   edit PAGE_THEME once and all five regions follow. */
var PAGE_THEME = {
  from:"#008CFF",      /* banners, buttons, gradients            */
  to:"#0057A8",
  ink:"#FFFFFF",       /* text on those gradients                */
  accent:"#FAB040",    /* icon strokes, rules, focus rings       */
  accentText:"#B07407" /* the same gold, deepened so small text and
                          white-on-gold buttons stay readable    */
};
function themed(r){
  var o = {}; for(var k in r) o[k] = r[k];
  o.from = PAGE_THEME.from; o.to = PAGE_THEME.to; o.ink = PAGE_THEME.ink;
  o.accent = PAGE_THEME.accent; o.accentText = PAGE_THEME.accentText;
  return o;
}

var REGIONS = [
  /* One client, one registration, so there is no region chooser — the page
     you land on IS this entry. Everything below reads from it. */
  { key:"kattsafe", name:"Sales Hiring Hub", from:"#008CFF", to:"#0057A8", ink:"#FFFFFF", accent:"#008CFF",
    options:[
      {key:"all", label:"All Candidates", job:"Sales Representative", copy:"en",
       reg:"https://info.objectivemanagement.com/RegistrationCandidates.aspx?ID=2063421&bc1=License+26232&bc1u=License.aspx%3fID%3d23230&bc2=Search+Licenses&bc2u=Licenses.aspx%3fstatus%3d2%26d1%3d%26d2%3d%26d%3d61%26c%3d42102%26pt%3d1%26csr%3d&bc3=Assessments",
       eval:"https://eval.objectivemanagement.com/XRC3DS9"}
    ] }
];

/* ==========================================================================
   HELPERS
   ========================================================================== */
function grad(r){ return "linear-gradient(150deg," + r.from + " 0%," + r.to + " 100%)"; }
function tint(hex,a){
  var n = parseInt(hex.slice(1),16);
  return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";
}
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
var ARROW = '<svg viewBox="0 0 24 24"><path d="M5 12h13M12.5 6l6 6-6 6"/></svg>';
var BACK  = '<svg viewBox="0 0 24 24"><path d="M19 12H6M11.5 6l-6 6 6 6"/></svg>';

/* panel with a coloured left accent */
function panel(inner){ return '<div class="panel">' + inner + '</div>'; }

function note(r,inner){
  return '<div class="note" style="background:' + tint(r.from,.10) +
         ';border-left:4px solid ' + r.accent + '">' + inner + '</div>';
}

function steps(r,list){
  return list.map(function(s,i){
    return '<div class="step">' +
      '<span class="num" style="background:' + grad(r) + '">' + (i+1) + '</span>' +
      '<div class="sb"><h3>' + s.h + '</h3>' + s.b + '</div></div>';
  }).join("");
}

function checklist(r,id,list){
  return '<div data-check="' + id + '">' + list.map(function(c,i){
    return '<label class="check">' +
      '<input type="checkbox" data-k="' + id + ':' + i + '" style="--on:' + (r.accentText||r.accent) + '">' +
      '<span>' + c.t + (c.s ? '<span class="sub">' + c.s + '</span>' : '') + '</span></label>';
  }).join("") + '</div>';
}

function fold(label,inner,open){
  return '<details class="fold"' + (open ? ' open' : '') + '><summary>' + label + '</summary>' +
         '<div class="foldbody">' + inner + '</div></details>';
}

function copyblock(r,label,text){
  var id = "cb" + (copyblock._n = (copyblock._n||0) + 1);
  window.__COPY = window.__COPY || {};
  window.__COPY[id] = text;
  return '<div class="copyblock"><div class="cbhead"><span class="cblabel">' + label + '</span>' +
    '<button class="copybtn" data-copy="' + id + '" style="--on:' + (r.accentText||r.accent) + '">Copy</button></div>' +
    '<div class="pre">' + esc(text) + '</div></div>';
}

function bigcard(r,href,title,sub){
  return '<a class="bigcard" href="' + href + '" target="_blank" rel="noopener" ' +
    'style="background:' + grad(r) + ';color:' + r.ink +
    ';box-shadow:0 18px 40px -22px ' + tint(r.from,.7) + '">' +
    '<span><span class="bt">' + title + '</span><span class="bs">' + sub + '</span></span>' + ARROW + '</a>';
}


/* The interview detail lives on the checklist now — step 4 is where a reader
   actually needs it. INTERVIEW_SECTION keeps its own URL working. */
function interviewSteps(r){
  return steps(r,[
    {h:"Five-minute phone interview",
     b:"<p>Purpose: qualify the candidate quickly.</p><p>What you are listening for:</p><ul>" +
       "<li>How they sound on the phone — tone, clarity, presence.</li>" +
       "<li>Whether they can build rapport.</li>" +
       "<li>Whether their experience matches the ad.</li>" +
       "<li>How they handle push-back or a put-off.</li></ul>"},
    {h:"First interview",
     b:"<p>Objective: validate the assessment and the resume through live conversation.</p><ul>" +
       "<li>Push back on the resume. Check for accuracy, patterns and truth.</li>" +

function emText(){ return docText("em-out"); }
function docText(id){
  var el = document.getElementById(id);
  if(!el) return "";
  var out = [];
  Array.prototype.forEach.call(el.childNodes, function(n){
    if(n.nodeType !== 1) return;
    if(n.tagName === "UL"){
      Array.prototype.forEach.call(n.children, function(li){
        out.push("\u2022 " + li.textContent.trim());
      });
      out.push("");
      return;
    }
    out.push(n.textContent.trim());
    if(String(n.className).indexOf("tight") === -1) out.push("");
  });
  return out.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

               : off ? 'background:rgba(150,150,160,.16);color:var(--ink-3)'
                     : 'color:var(--ink-3)';
        return '<td class="yn" data-r="' + i + '" data-c="' + c.k + '"><span style="' + st + '">' +

function wireTracking(r){
  var host = document.getElementById("trk-host");
  function paint(){ host.innerHTML = trkTable(r); wire();
    if(LANG !== "en") translateTree(host); }
  function wire(){
    Array.prototype.forEach.call(host.querySelectorAll("input[data-c]"), function(el){
      el.addEventListener("input", function(){
        TRK.rows[+el.getAttribute("data-r")][el.getAttribute("data-c")] = el.value;
        trkSave();
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll("td.mark,td.yn"), function(td){
      td.addEventListener("click", function(){
        var i = +td.getAttribute("data-r"), c = td.getAttribute("data-c");
        var cur = TRK.rows[i][c] || "";
        if(td.className.indexOf("yn") > -1){
          TRK.rows[i][c] = cur === "" ? "Yes" : cur === "Yes" ? "No" : "";
        } else {
          TRK.rows[i][c] = cur ? "" : "x";
        }
        trkSave(); paint();
      });
    });
  }
  wire();
  document.getElementById("trk-add").addEventListener("click", function(){
    TRK.rows.push({}); trkSave(); paint();
  });
  document.getElementById("trk-clear").addEventListener("click", function(){
    if(!confirm("Clear every row on this device?")) return;
    TRK.rows = []; for(var i=0;i<TRK_START_ROWS;i++) TRK.rows.push({});
    trkSave(); paint();

  var h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  return (h ? h + ":" + (m<10?"0":"") : "") + m + ":" + (s<10?"0":"") + s;
}

var YT_READY = false, PLAYERS = {}, PENDING = [];
window.onYouTubeIframeAPIReady = function(){
  YT_READY = true;
  while(PENDING.length){ var q = PENDING.shift(); mountPlayer(q[0], q[1]); }
};
function mountPlayer(hostId, videoId){
  var host = document.getElementById(hostId);
  if(!host) return;
  if(!YT_READY || !window.YT || !YT.Player){
    /* the API is still loading — queue every mount, not just the last one */
    PENDING.push([hostId, videoId]);
    if(!document.getElementById("yt-api")){
      var sc = document.createElement("script");
      sc.id = "yt-api"; sc.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(sc);
    }
    return;
  }
  PLAYERS[hostId] = new YT.Player(hostId, {
    videoId: videoId,
    playerVars: {rel:0, modestbranding:1, playsinline:1}
  });
}
function seekTo(t, videoId, hostId){
  var P = PLAYERS[hostId];
  if(P && P.seekTo){
    P.seekTo(t, true);
    if(P.playVideo) P.playVideo();
    var st = document.getElementById(hostId);
    st = st && st.closest ? st.closest(".stage") : null;
    if(st) st.scrollIntoView({behavior:"smooth", block:"start"});
  } else {
    /* the API never loaded — fall back to opening YouTube at that moment */
    window.open("https://youtu.be/" + videoId + "?t=" + Math.round(t), "_blank", "noopener");
  }
}

  var body = FINDINGS.map(function(g){
    return '<div class="fgroup" data-g="' + esc(g.g) + '">' +
      '<p class="fglabel">' + esc(g.g) + '</p>' +
      g.items.map(function(it){
        var slug = compSlug(it.n);
        var name = slug
          ? '<a href="#' + r.key + '/findings/' + slug + (compAnchor(it.n) !== null ? "/" + compAnchor(it.n) : "") + '">' + esc(it.n) + '</a>'
          : esc(it.n);
        return '<div class="frow" data-k="' + esc((g.g + " " + it.n + " " + it.d).toLowerCase()) + '">' +
               '<div class="fn">' + name + '</div>' +
               '<div class="fd">' + esc(it.d) + '</div></div>';
      }).join("") + '</div>';
  }).join("");

  return panel(
    '<input class="ffilter" id="f-filter" type="text" autocomplete="off" ' +
      'placeholder="Filter competencies">' +
    '<p class="fnone" id="f-none" hidden>No competency matches that.</p>' +
    body
  );
}

function wireFindings(){
  var box = document.getElementById("f-filter");
  var none = document.getElementById("f-none");
  if(!box) return;
  box.addEventListener("input", function(){
    var q = box.value.trim().toLowerCase(), hits = 0;
    Array.prototype.forEach.call(document.querySelectorAll(".fgroup"), function(g){
      var shown = 0;
      Array.prototype.forEach.call(g.querySelectorAll(".frow"), function(row){
        var on = !q || row.getAttribute("data-k").indexOf(q) !== -1;
        row.hidden = !on;
        if(on){ shown++; hits++; }
      });
      g.hidden = (shown === 0);
    });
    none.hidden = (hits > 0);
  });
}

var COMP = {"articles":{"hunting":{"competency":"Hunting","title":"Findings Reference: Hunting Competency","intro":["The Hunting Competency tells us about the individual’s ability to prospect for new business. It looks at components such as whether the individual will make cold calls, the Sales DNA that might get in the way of getting started or continuing making cold calls, and their ability to reach a decision maker and fill their pipeline."],"components":["Will Prospect","Prospects Consistently","Prospects via Phone and / or Walk-ins","Has No Need for Approval","Schedules Meetings","Recovers from Rejection","Maintains Full Pipeline","Not a Perfectionist or it Does Not Prevent Prospecting","Believes They Are Quickly Liked by Customers","Reaches Target Prospect","Gets Referrals from Customers / Network","Uses Social Selling Tools","Attends Networking Events"],"includedIn":["Sales Evaluation / Sales Candidate Assessment","Sales Evaluation of the Non-Selling Professional","Business Development Evaluation"],"findings":[{"name":"Will Prospect","desc":"This finding reflects whether an individual is likely to rely on cold calling when needing to find new customers.","alsoFoundIn":["Strengths - Will Prospect"],"opposite":["Account Management Competency - Will Focus on Current Accounts Rather than Looking for New Accounts","Farming Competency - Unlikely to be Distracted by New Accounts"]},{"name":"Prospects Consistently","desc":"This finding reflects whether the individual prospects on a daily basis, the individual says their boss would say they prospect regularly, and/or makes cold calls regularly.","alsoFoundIn":["Skills - Prospects Consistently"]},{"name":"Prospects via Phone and / or Walk-ins","desc":"This finding reflects whether the individual makes cold calls via phone and/or walk-ins.","alsoFoundIn":["Skills - Prospects via Phone and / or Walk-ins"]},{"name":"Has No Need for Approval","desc":"This finding shows to what degree the individual needs to be liked or (in severe cases) loved.  When an individual needs to be liked, they will have more trouble asking lots of questions or tough questions and having the difficult conversation that no one else has had, which will impede their ability to hunt for new business.","alsoFoundIn":["Strengths - Does Not Need to be Liked","Sales DNA - Doesn't Need Approval","Consultative Selling Competency - Able to Ask Tough Questions","Selling Value Competency - Doesn't Need Approval","Qualifying Competency - Need to Be Liked Doesn't Get in the Way","Closing Competency - Isn't Hoping to be Liked","Negotiating Competency - Doesn't Need to be Liked","Reaching Decision-Makers Competency - Does Not Need to be Liked"],"opposite":["Account Management Competency - Won't Alienate People"]},{"name":"Schedules Meetings","desc":"This finding reflects whether the individual is generally able to get appointments when they try, or if they get impeded by having to send literature, call back, or otherwise don't get appointments.","alsoFoundIn":["Skills - Schedules Meetings"]},{"name":"Recovers from Rejection","desc":"This finding reflects whether the individual can easily recover from rejection.  Someone who has difficulty recovering from rejection will have trouble hunting for new business, as his/her focus on failed opportunities will get in the way of refocusing energy on potential new opportunities.","alsoFoundIn":["Strengths - Recovers from Rejection","Sales DNA - Handles Rejection","Negotiating Competency - Rejection Proof"],"opposite":["Farming Competency - Won't Alienate Customers"]},{"name":"Maintains Full Pipeline","desc":"This finding reflects whether the individual indicated that his/her pipeline is generally full or has many opportunities.","alsoFoundIn":["Skills - Maintains Full Pipeline"]},{"name":"Not a Perfectionist or it Does Not Prevent Prospecting","desc":"Individuals with a weakness in this finding indicate that they consider themselves to be perfectionists AND that their perfectionism has delayed past opportunities.","alsoFoundIn":["Strengths - Not a Perfectionist or it Does Not Prevent Prospecting"]},{"name":"Believes They Are Quickly Liked by Customers","desc":"This finding reflects whether this individual feels prospects tend to quickly  like him/her, how quickly this individual develops rapport, and/or whether this individual is known for being well-liked or loved by customers.","alsoFoundIn":["Building Trust Competency - Believes They Are Quickly Liked by Customers","Farming Competency - Believes They Are Quickly Liked by Customers"]},{"name":"Reaches Target Prospect","desc":"This finding reflects whether the individual is generally able to reach prospects, or if they find themselves blocked by operators, assistants, etc.","alsoFoundIn":["Skills - Reaches Target Prospect"]},{"name":"Gets Referrals from Customers / Network","desc":"This finding reflects whether the individual regularly receives referrals and introductions from their customers.","alsoFoundIn":["Relationship Building - Relationships Generate New Business"]},{"name":"Uses Social Selling Tools","desc":"This finding will be strong if the Mastery of Social Selling Competency has a score of 67% or higher."},{"name":"Attends Networking Events","desc":"This finding reflects whether the individual attends networking or targeted events to get leads.  If the finding is negative, the individual either avoids such events or is unable to generate leads from them.","alsoFoundIn":["Strengths - Attends Networking Events"]}]},"relationship-building":{"competency":"Relationship Building","title":"Findings Reference: Relationship Building Competency","intro":["The Relationship Building Competency shows how effective a salesperson is at developing relationships -- more than just finding common ground, but truly developing a relationship. It is important that relationships gets developed quickly to sell consultatively."],"components":["Quickly Develops Rapport","Relationship Is Key Factor in Winning Business","Relationships Generate New Business","Develops Strong Relationships over Time","Customers Follow to New Companies","Believes That Making Friends Is Single Greatest Asset","Extroversion Supports Relationship Building"],"includedIn":["Sales Evaluation / Sales Candidate Assessment","Business Development Evaluation"],"findings":[{"name":"Quickly Develops Rapport","desc":"This finding reflects whether an individual is generally able to build rapport on their first call or meeting.","alsoFoundIn":["Skills - Quickly Develops Rapport","Selling Value Competency - Quickly Develops Rapport","Sales Posturing Competency - Quickly Develops Rapport","Building Trust Competency - Quickly Builds Rapport"]},{"name":"Relationship Is Key Factor in Winning Business","desc":"When this finding is positive, it means that the individual indicated that the best description of their sales approach/process is that the relationship is the key factor in getting/maintaining/growing business.  This would mean that the individual chose this option over other more typical sales approaches/processes, including a consultative approach, which means a strength in this finding means that the individual is not following a milestone-centric sales process.  However, as it pertains purely to relationship building, a relationship-based sales process is supportive of successful relationship building.","alsoFoundIn":["Strengths - Relationship is Key Factor in Winning Business"]},{"name":"Relationships Generate New Business","desc":"This finding reflects whether the individual regularly receives referrals and introductions from their customers.","alsoFoundIn":["Hunting - Gets Referrals from Customers / Network"]},{"name":"Develops Strong Relationships over Time","desc":"If this finding is positive, it means the individual is able to develop strong rapport and has ongoing interactions with customers (following to a new company, being asked for by name, becoming friends, remaining friends over time, and/or being invited to social events) that are indicative of strong long-term relationships.","alsoFoundIn":["Skills - Develops Strong Relationships over Time"]},{"name":"Customers Follow to New Companies","desc":"This finding indicates whether customers tend to follow the individual to new companies if they change jobs.  From the standpoint of relationship building, this is considered a positive.  Of course, this needs to be balanced with the potential liability of having an employee who customers would follow if he/she were to leave.","alsoFoundIn":["Skills - Customers Follow to New Companies"]},{"name":"Believes That Making Friends Is Single Greatest Asset","desc":"This finding indicates that the individual feels that making friends with prospects/customers is the single most important thing they do."},{"name":"Extroversion Supports Relationship Building","desc":"This finding reflects whether the individual self-identifies as an extrovert, as opposed to an introvert, ambivert, or being unsure.  While it is not absolutely necessary for someone to be an extrovert in order to build relationships, being an extrovert does support relationship building.","alsoFoundIn":["Strength - Extroversion Supports Relationship Building"]}]},"value-selling":{"competency":"Value Selling","title":"Findings Reference: Selling Value Competency","intro":["This competency is a measure of how effectively an individual is able to sell value as opposed to sell based on price, maximize margins instead of discounts, and compete against the competition which might have a lower price without giving up on your price."],"components":["Focused on Value over Price","Will Discuss Finances","High Threshold for Money","Attempts to Sell Value","Sales Process Supports Selling Value","Learns Why Prospects Will Buy","Doesn't Need Approval","Asks Great Questions","Asks Enough Questions","Avoids Making Assumptions","Quickly Develops Rapport","Not Compelled to Quote"],"includedIn":["Sales Evaluation / Sales Candidate Assessment","Sales Management Evaluation / Sales Management Candidate Assessment","Sales Evaluation of the Non-Selling Professional","Business Development Evaluation"],"findings":[{"name":"Focused on Value over Price","desc":"Someone who is weak in this finding is a \"price shopper\", and in their own buying practices tends to place a lot of importance on finding the best price.  People who tend to shop based on price rather than value in their personal lives tend to be accepting or understanding of prospects or customers who also want to make sure they are getting the best price.","alsoFoundIn":["Strengths - Focused on Value over Price","Sales DNA - Buy Cycle - 1 of 5 components"]},{"name":"Will Discuss Finances","desc":"Note: before October 2021, this attribute was called \"Comfortable Discussing Money\"\n\nThis finding reflects whether the individual has the ability to talk about money with a great deal of ease. Individuals with a weakness in this finding don't think of talking about money as a normal part of selling, and may feel that talking about money is too invasive.","alsoFoundIn":["Strengths - Will Discuss Finances","Qualifying Competency - Will Discuss Finances","Negotiating Competency - Will Discuss Finances"]},{"name":"High Threshold for Money","desc":"This finding reflects how this individual is likely to respond to the customer's objections to something costing a lot of money, based on how the individual tends to think about money personally.","alsoFoundIn":["Strengths - High Threshold for Money","Sales DNA - Buy Cycle - 1 of 5 components","Qualifying Competency - Handles High-Ticket Pricing OK","Farming Competency - Handles \"It's a Lot of Money\" Objection"]},{"name":"Attempts to Sell Value","desc":"This finding reflects how the individual responds to a prospect or customer asking for a lower price.  A positive finding indicates that the individual will sell value or hold firm.  A negative finding indicates that the individual will either give in or negotiate."},{"name":"Sales Process Supports Selling Value","desc":"We asked this individual to select from a list of different possible sales processes the one that they most identify with and have had the most success with.  This finding indicates whether the sales process they selected has key milestones.","alsoFoundIn":["Sales Process Competency - Process Has Most Key Milestones"]},{"name":"Learns Why Prospects Will Buy","desc":"A strength in this finding indicates that the individual listens and learns why their customer/prospect will make a purchase, and that the reasons for buying are truly compelling for the customer/prospect.  A weakness in this finding indicates that the individual might make assumptions about why the prospect/customer would buy, tell the prospect/customer why they should buy, or find reasons that aren't truly compelling.","alsoFoundIn":["Skills - Uncovers Reasons to Buy","Consultative Selling Competency - Uncovers Reasons to Buy + Reasons to Buy are Compelling","Qualifying Competency - Knows Why They Would Buy","Coaching Competency (Sales Management) - Uncovers Compelling Reasons to Buy"]},{"name":"Doesn't Need Approval","desc":"This finding shows to what degree the individual needs to be liked or (in severe cases) loved.  When an individual needs to be liked, they will have more trouble asking lots of questions or tough questions and having the difficult conversation that no one else has had, which will impede their ability to hunt for new business.","alsoFoundIn":["Strengths - Does Not Need to be Liked","Sales DNA - Doesn't Need Approval","Hunting Competency - Has No Need for Approval","Consultative Selling Competency - Able to Ask Tough Questions","Qualifying Competency - Need to Be Liked Doesn't Get in the Way","Closing Competency - Isn't Hoping to be Liked","Negotiating Competency - Doesn't Need to be Liked","Reaching Decision-Makers Competency - Does Not Need to be Liked"],"opposite":["Account Management Competency - Won't Alienate People"]},{"name":"Asks Great Questions","desc":"This finding checks for a number of aspects indicative of asking great questions, including the importance the individual places on asking questions, how the individual responds to objections, how to-the-point versus threatening questions are, whether questions determine why the customer/prospect will buy, and whether questions address how the customer/prospect will buy.","alsoFoundIn":["Skills - Asks Great Questions","Consultative Selling Competency - Asks Great Questions"]},{"name":"Asks Enough Questions","desc":"This finding indicates whether the individual understands the importance of not dominating the conversation on sales calls, by frequently asking questions.","alsoFoundIn":["Skills - Asks Enough Questions","Consultative Selling Competency - Asks Enough Questions","Presentation Approach and Context Competency - Asks Enough Questions","Accountability Competency (Sales Management) - Asks Enough Questions","Coaching Competency (Sales Management) - Asks Enough Questions","Recruiting Competency (Sales Management) - Great Interviewing Skills"]},{"name":"Avoids Making Assumptions","desc":"This finding reflects whether the individual relies on factual information during sales calls, as opposed to making assumptions or going on hunches.","alsoFoundIn":["Skills - Takes Nothing For Granted","Consultative Selling Competency - Takes Nothing for Granted","Selling Value Competency - Avoids Making Assumptions","Qualifying Competency - Asks about Everything","Presentation Approach and Context Competency - Takes Nothing for Granted"]},{"name":"Quickly Develops Rapport","desc":"This finding reflects whether an individually is generally able to build rapport on their first call or meeting.","alsoFoundIn":["Skills - Quickly Develops Rapport","Relationship Building Competency - Quickly Develops Rapport","Sales Posturing Competency - Quickly Develops Rapport","Building Trust Competency - Quickly Builds Rapport"]},{"name":"Not Compelled to Quote","desc":"This finding reflects the mindset this individual has regarding creating quotes and proposals.  A positive finding indicates that they only create quotes or proposals if they know they are going to win the business.","alsoFoundIn":["Skills - Won't Make Inappropriate Quotes","Closing Competency - Won't Make Inappropriate Quotes"]}]},"qualifying":{"competency":"Qualifying","title":"Findings Reference: Qualifying Competency","intro":["The Qualifying Competency shows how thoroughly an individual qualifies opportunities. The score will reflect how well, how often, and how effectively the individual is qualifying. Properly qualifying opportunities has a tremendous impact on the accuracy of a company's pipeline and forecast."],"components":["Meets with Decision Maker","Uncovers Actual Budget","Will Discuss Finances","Knows Decision-Making Process","Can Influence the Decision-Making Process","Handles High-Ticket Pricing OK","Need to Be Liked Doesn't Get in the Way","Able to Stay in the Moment","Self-Limiting Beliefs Won't be an Obstacle","Knows Why They Would Buy","Asks about Everything","Not Vulnerable to Competition"],"includedIn":["Sales Evaluation / Sales Candidate Assessment","Sales Management Evaluation / Sales Management Candidate Assessment","Sales Evaluation of the Non-Selling Professional","Business Development Evaluation"],"findings":[{"name":"Meets with Decision Maker","desc":"This finding will be strong if the Reaching Decision-Makers Competency has a score of 67% or higher.","alsoFoundIn":["Closing Competency - Will Meet with the Decision Maker","Account Management Competency - Will Meet/Talk with Decision Makers"]},{"name":"Uncovers Actual Budget","desc":"Reflects whether the individual usually knows how much money prospects are able to spend before closing.","alsoFoundIn":["Skill - Uncovers Actual Budget","Account Management Competency - Will Know the Real Budgets"]},{"name":"Will Discuss Finances","desc":"This finding reflects whether the individual has the ability to talk about money with a great deal of ease.  Individuals with a weakness in this finding don't think of talking about money as a normal part of selling, and may feel that talking about money is too invasive.","alsoFoundIn":["Strengths - Will Discuss Finances","Selling Value Competency - Will Discuss Finances","Negotiating Competency - Will Discuss Finances"]},{"name":"Knows Decision-Making Process","desc":"This finding reflects whether the individual is successful in getting prospects to disclose the process they will use to decide whether to buy from them.","alsoFoundIn":["Skills - Understands How Prospects Will Buy","Consultative Selling Competency - Understands How Prospects Will Buy","Coaching Competency (Sales Management) - Knows How People Buy"]},{"name":"Can Influence the Decision-Making Process","desc":"This finding reflects whether the individual tends to suggest and effect changes to a prospect's decision-making process when it is overly complex, unfavorable, and impeding an opportunity.","alsoFoundIn":["Skills - Can Influence the Decision-Making Process"]},{"name":"Handles High-Ticket Pricing OK","desc":"This finding reflects how this individual is likely to respond to the customer's objections to something costing a lot of money, based on how the individual tends to think about money personally.","alsoFoundIn":["Strengths - High Threshold for Money","Sales DNA - Buy Cycle - 1 of 5 components","Selling Value Competency - High Threshold for Money","Farming Competency - Handles \"It's a Lot of Money\" Objection"]},{"name":"Need to Be Liked Doesn't Get in the Way","desc":"This finding shows to what degree the individual needs to be liked or (in severe cases) loved.  When an individual needs to be liked, they will have more trouble asking lots of questions or tough questions and having the difficult conversation that no one else has had, which will impede their ability to hunt for new business.","alsoFoundIn":["Strength - Does Not Need to be Liked","Sales DNA - Doesn't Need Approval","Hunting Competency - Has No Need for Approval","Consultative Selling Competency - Able to Ask Tough Questions","Selling Value Competency - Doesn't Need Approval","Closing Competency - Isn't Hoping to be Liked","Negotiating Competency - Doesn't Need to be Liked","Reaching Decision-Makers Competency - Does Not Need to be Liked"],"opposite":["Account Management Competency - Won't Alienate People"]},{"name":"Able to Stay in the Moment","desc":"This finding reflects the individual's ability to stay in the moment and be focused on the now, instead of becoming emotional and worrying about what already has happened or what is going to happen.","alsoFoundIn":["Strength - Able to Stay in the Moment","Sales DNA - Stays in the Moment","Consultative Selling Competency - Able to Stay in the Moment","Closing Competency - Will Stay in the Moment at Closing Time","Negotiating Competency - Able to Stay in the Moment","Farming Competency - Won't Panic Over Objections","Coaching Competency (Sales Management) - Able to Stay in the Moment"]},{"name":"Self-Limiting Beliefs Won't be an Obstacle","desc":"This finding indicates whether the individual's Supportive Beliefs Competency is in the strong scoring range.","alsoFoundIn":["Sales DNA - Supportive Beliefs"]},{"name":"Knows Why They Would Buy","desc":"A strength in this finding indicates that the individual listens and learns why their customer/prospect will make a purchase, and that the reasons for buying are truly compelling for the customer/prospect.  A weakness in this finding indicates that the individual might make assumptions about why the prospect/customer would buy, tell the prospect/customer why they should buy, or find reasons that aren't truly compelling.","alsoFoundIn":["Skills - Uncovers Reasons to Buy","Consultative Selling Competency - Uncovers Reasons to Buy + Reasons to Buy are Compelling","Selling Value Competency - Learns Why Prospects Will Buy","Coaching Competency (Sales Management) - Uncovers Compelling Reasons to Buy"]},{"name":"Asks about Everything","desc":"This finding reflects whether the individual relies on factual information during sales calls, as opposed to making assumptions or going on hunches.","alsoFoundIn":["Skills - Takes Nothing For Granted","Consultative Selling Competency - Takes Nothing for Granted","Selling Value Competency - Avoids Making Assumptions","Presentation Approach and Context Competency - Takes Nothing for Granted"]},{"name":"Not Vulnerable to Competition","desc":"Someone who is weak in this finding is a comparison shopper, and tends to shop at several stores for major purchases.  The danger with a comparison shopper is that he or she is likely to allow prospects to behave similarly, as they will be sympathetic to the prospect's desire to \"shop around\".","alsoFoundIn":["Strengths - Not Vulnerable to Competition","Sales DNA - Buy Cycle - 1 of 5 components"]}]},"presentation-approach":{"competency":"Presentation Approach","title":"Findings Reference: Presentation Approach and Context Competency","intro":["This competency does NOT measure a salesperson's presentation skills, but rather measures whether presentations are occurring at the right time, to the right people, and for the right reasons. It's important for salespeople to not be overly presentation-minded or rely too heavily on presentations."],"components":["Emphasizes Listening over Talking","Able to Minimize Talking about Company Products or Solutions","Not Compelled to Present","Not Overly Reliant on Educating and Presenting","Does Not Believe Presenting Equates to Controlling the Sales Process","Does Not Believe Making A Proposal is the Most Important Part of the Sales Process","Not Compelled to Propose or Quote","Asks Enough Questions","Takes Nothing for Granted"],"includedIn":["Sales Evaluation / Sales Candidate Assessment","Sales Evaluation of the Non-Selling Professional","Business Development Evaluation"],"findings":[{"name":"Emphasizes Listening over Talking","desc":"A weakness in this finding indicates that the individual is typically doing more than half of the talking on sales calls.","alsoFoundIn":["Sales DNA - Stays in the Moment - 1 of 9 components","Strengths - Emphasizes Listening over Talking"]},{"name":"Able to Minimize Talking about Company Products or Solutions","desc":"This finding reflects whether individuals spend most of their time asking questions, as opposed to talking about their company, products, services, and/or solutions.","alsoFoundIn":["Strengths - Able to Minimize Talking about Company Products or Solutions"]},{"name":"Not Compelled to Present","desc":"This finding reflects whether the individual feels making a presentation is the most important thing to do before attempting to close an opportunity, as opposed to reviewing needs or getting the prospect to agree to make a decision.","alsoFoundIn":["Strengths - Not Compelled to Present","Self-Limiting Beliefs - I need to make presentations"]},{"name":"Not Overly Reliant on Educating and Presenting","desc":"A weakness in this finding indicates that the individual feels that educating and presenting is their greatest asset or the single most important thing they do.","alsoFoundIn":["Strengths - Not Overly Reliant on Educating and Presenting"]},{"name":"Does Not Believe Presenting Equates to Controlling the Sales Process","desc":"A weakness in this finding indicates that the individual only feels in control of the selling process when he/she is presenting.","alsoFoundIn":["Strengths - Does Not Believe Presenting Equates to Controlling the Sales Process"]},{"name":"Does Not Believe Making A Proposal is the Most Important Part of the Sales Process","desc":"A weakness in this finding indicates that the individual feels making a proposal is more important to winning an opportunity than asking questions, uncovering the budget, or getting a commitment.","alsoFoundIn":["Strengths - Does Not Believe Making A Proposal is the Most Important Part of the Sales Process"]},{"name":"Not Compelled to Propose or Quote","desc":"This finding reflects whether the individual views proposals/quotes as either unnecessary or acceptable if they expect to win the opportunity.","alsoFoundIn":["Strengths - Not Compelled to Propose or Quote","Self-Limiting Beliefs - I need to provide proposals (or quotes)"]},{"name":"Asks Enough Questions","desc":"This finding indicates whether the individual understands the importance of not dominating the conversation on sales calls, by frequently asking questions.","alsoFoundIn":["Skills - Asks Enough Questions","Consultative Selling Competency - Asks Enough Questions","Selling Value Competency - Asks Enough Questions","Accountability Competency (Sales Management) - Asks Enough Questions","Coaching Competency (Sales Management) - Asks Enough Questions","Recruiting Competency (Sales Management) - Great Interviewing Skills"]},{"name":"Takes Nothing for Granted","desc":"This finding reflects whether the individual relies on factual information during sales calls, as opposed to making assumptions or going on hunches.","alsoFoundIn":["Skills - Takes Nothing For Granted","Consultative Selling Competency - Take Nothing for Granted","Selling Value Competency - Avoids Making Assumptions","Qualifying Competency - Asks about Everything"]}]},"closing":{"competency":"Closing","title":"Findings Reference: Closing Competency","intro":["This competency measures how effective the individual is at closing business. Most salespeople (even the great ones) have a fairly low score in this competency, because if a salesperson excels at Consultative Selling, Qualifying, and Sales Posturing, then closing is essentially a non-event and essentially takes care of itself. However, when a salesperson isn't very good at taking care of the business that happens prior to closing, then all the pressure is on them at closing time and the score in this competency becomes more important."],"components":["Gets Prospect to Agree to Make a Decision","Not Likely to Take \"Think it Overs\"","Unlikely to be Derailed by Put-Offs","Manages Appropriate Amount of Patience","Closing Urgency","Sales Assertiveness","Won't Make Inappropriate Quotes","Problem Solver","Reaching Decision-Makers","Doesn't Need Approval","Stays in the Moment","Will Find a Way to Close","Seeks Win/win"],"includedIn":["Sales Evaluation / Sales Candidate Assessment","Sales Management Evaluation / Sales Management Candidate Assessment","Sales Evaluation of the Non-Selling Professional","Business Development Evaluation"],"findings":[{"name":"Gets Prospect to Agree to Make a Decision","desc":"This is the most important attribute in the Closing Competency, and reflects whether the individual gets the prospect or customer to agree to make a decision before trying to close.","alsoFoundIn":["Skills - Gets Prospects to Agree to Make a Decision","Coaching Competency (Sales Management) - Effective at Getting Commitments"]},{"name":"Not Likely to Take \"Think it Overs\"","desc":"If this finding is negative, it indicates that the individual tends to think over purchases.  Individuals who behave this way are likely to understand and allow their prospects or customers to behave similarly, which will delay closings.  This finding is the most important component of Buy Cycle in Sales DNA.","alsoFoundIn":["Strengths - Not Likely to Take \"Think It Overs\"","Sales DNA - Buy Cycle - 1 of 5 components","Recruiting Competency (Sales Management) - Good Decision Maker"]},{"name":"Unlikely to be Derailed by Put-Offs","desc":"This finding reflects whether the individual will avoid put offs both when trying to schedule meetings / appointments and when trying to close an opportunity.","alsoFoundIn":["Skill - Unlikely to be Derailed by Put-Offs","Farming Competency - Won't Accept Put-Offs"]},{"name":"Manages Appropriate Amount of Patience","desc":"We measure patience on a spectrum from “Too Impatient” on one end to “Too Patient” on the other end.  Too much impatience can come across rude to a prospect and frustrate them.  Too much patience can delay closing.  An ideal score, representing an appropriate amount of patience, is in the middle of that spectrum, where an individual is neither too impatient nor too patient.","alsoFoundIn":["Strengths - Manages Appropriate Amount of Patience","Consultative Selling Competency - Manages Appropriate Amount of Patience","Sales Posturing Competency - Appropriate Amount of Patience","Negotiating Competency - Manages Appropriate Amount of Patience"]},{"name":"Closing Urgency","desc":"This finding reflects whether the individual has strong closing urgency.  This finding is strong when an individual pushes back strongly against being asked to call back / follow up later.","alsoFoundIn":["Strength - Closing Urgency","Closing Competency - Closing Urgency","Farming Competency - Has Closing Urgency"],"opposite":["Account Management Competency - Won't Feel Urgency to Close Business"]},{"name":"Sales Assertiveness","desc":"Sales Assertiveness measures the ability to confidently and professionally engage with prospective customers in a way that earns their trust and respect. It involves persistently pursuing opportunities and asking insightful questions to uncover needs. Assertive sales professionals are problem-solvers who handle confrontation tactfully and are able to maintain empathy and control while navigating the complexities of the sales process.","alsoFoundIn":["Strengths - Sales Assertiveness"]},{"name":"Won't Make Inappropriate Quotes","desc":"This finding reflects the mindset this individual has regarding creating quotes and proposals.  A positive finding indicates that they only create quotes or proposals if they know they are going to win the business.","alsoFoundIn":["Skills - Won't Make Inappropriate Quotes","Selling Value Competency - Not Compelled to Quote"]},{"name":"Problem Solver","desc":"A positive finding indicates that a perso
